name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Reconstruire le projet Android
        run: base64 -d proj.b64 | tar xz

      - name: Compiler l'APK
        working-directory: HopitalApp
        run: gradle assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: HopitalApp-apk
          path: HopitalApp/app/build/outputs/apk/debug/*.apk
